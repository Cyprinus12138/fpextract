name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,cv]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: |
          fpextract --version
          fpextract try-norm samples/harbour-view/harbour-view-type-a1.png --no-browser --out /tmp/n.html
          python scripts/make_samples.py --out /tmp/samples && test -f /tmp/samples/manifest.jsonl
