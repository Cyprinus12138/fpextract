[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpextract"
version = "0.1.0"
description = "Structured floor-plan extraction with vision LLMs: provider-agnostic client, batch API with crash-safe resume, LLM localisation refined by OpenCV, and project-level rollups with provenance and confidence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mr.Cyprinus"}]
keywords = ["floor-plan", "vision", "llm", "extraction", "real-estate", "anthropic", "openai", "qwen"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "anthropic>=0.39.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
cv = ["opencv-python-headless>=4.8", "numpy>=1.24"]
pg = ["psycopg[binary]>=3.1"]
# SLBR watermark removal needs PyTorch plus a clone of the SLBR repo; see docs/PIPELINE.md.
slbr = ["torch>=2.1", "torchvision>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.5", "jsonschema>=4.20", "opencv-python-headless>=4.8", "numpy>=1.24"]

[project.scripts]
fpextract = "fpextract.cli:main"

[project.urls]
Homepage = "https://github.com/Cyprinus12138/fpextract"
Issues = "https://github.com/Cyprinus12138/fpextract/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fpextract.llm" = ["prompts/*.md", "schema/*.json"]
"fpextract.sink" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
